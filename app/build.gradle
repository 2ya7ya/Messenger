plugins { id 'com.android.application' }

android {
    namespace 'com.facebook.messengerclone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.facebook.messengerclone'
        minSdk 24
        targetSdk 35
        versionCode 154
        versionName '1.54-native-v146-group-thread-reply'
        buildConfigField 'String', 'BASE_URL', '"https://facebook-extra.onrender.com"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
